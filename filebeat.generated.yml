# Filebeat configuration: PostgreSQL JSON log collection
# Organization: Real Estate US | Space: aotf | Environment: prd | Application: aotfapp
# Generated by filebeat-config-review. Deployable format only; not verified end-to-end (see chat response section 3).

filebeat.inputs:
  - type: filestream
    id: aotfapp-postgresql-log
    enabled: true
    paths:
      - ${POSTGRESQL_LOG_PATH:?set the absolute path(s) to the PostgreSQL jsonlog output, e.g. /var/log/postgresql/*.json}
    parsers:
      - multiline:
          type: pattern
          # PostgreSQL jsonlog writes one complete JSON object per line; this pattern
          # keeps multi-line "message"/"detail" values (embedded newlines) attached to
          # the opening brace of the same record instead of splitting the event.
          pattern: '^\{'
          negate: true
          match: after
          timeout: 5s
          max_lines: 500
    fields:
      log_category: database
      log_producer: postgresql
    fields_under_root: false

processors:
  # Decode the JSON PostgreSQL jsonlog record into its own namespace rather than the
  # document root, per FB012: avoids untrusted dotted-key expansion and root collisions.
  - decode_json_fields:
      fields: ["message"]
      target: "postgresql.log"
      process_array: false
      max_depth: 2
      overwrite_keys: true
      add_error_key: true

  # Field naming/type alignment with the existing Elasticsearch mapping (e.g. mapping
  # postgresql.log.user -> user.name, sql_state_code -> error.code, pid -> process.pid)
  # is intentionally NOT done here. See the chat response's Mapping comparison table —
  # review and apply those changes at the mapping/ingest-pipeline layer, not in this file.
  # @timestamp is left at its default (event ingestion time); no timestamp/timezone
  # processor or conversion is added here.

  - add_fields:
      target: ""
      fields:
        labels:
          organization: "Real Estate US"
          space: "aotf"
          environment: "prd"
          application: "aotfapp"

  - add_host_metadata: ~
  - add_cloud_metadata: ~

output.logstash:
  enabled: true
  hosts: ["prd-logs-listener-us.solutions.corelogic.com:8080"]
  ttl: 300s
  pipelining: 0
  max_retries: -1
  # Retain existing approved TLS/proxy/keystore settings here; none were supplied.
  # ssl.certificate_authorities: ["${CA_CERT_PATH:?set the approved CA bundle path}"]

output.console.enabled: false
